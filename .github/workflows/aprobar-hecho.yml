# Cuando Álvaro le pone la etiqueta "aprobado" a un issue del Lector de prensa, el hecho pasa a data/eventos.json.
name: Aprobar hecho de prensa

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

jobs:
  aprobar:
    if: github.event.label.name == 'aprobado'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cargar el hecho
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node scripts/gestores/aprobar.mjs
      - name: Guardar y cerrar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "observatorio-bot"
          git config user.email "observatorio-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Hecho aprobado: #${{ github.event.issue.number }}"
          git pull --rebase -X theirs || true
          git push
          gh issue close ${{ github.event.issue.number }} -R ${{ github.repository }} -c "Cargado en el observatorio."
