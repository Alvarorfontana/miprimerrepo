name: Actualizar datos públicos

on:
  schedule:
    - cron: "17 12 5,20 * *"   # días 5 y 20 de cada mes, 9:17 hora argentina
  workflow_dispatch: {}        # botón "Run workflow" para correrlo a mano
  push:                        # también corre cuando cambian el robot o sus scripts
    branches: [main]
    paths:
      - ".github/workflows/actualizar-datos.yml"
      - "scripts/**"
      - "data/indicadores.json"
      - "data/eventos.json"
      - "data/alertas-reglas.json"

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Indicadores del INDEC (API Series de Tiempo)
        run: node scripts/actualizar-indicadores.mjs
        continue-on-error: true
      - name: Establecimientos metalúrgicos (CEP XXI)
        run: node scripts/actualizar-establecimientos.mjs
        continue-on-error: true
      - name: Plantas candidatas en OpenStreetMap
        run: node scripts/actualizar-osm.mjs
        continue-on-error: true
      - name: Barrios de la Ciudad de Buenos Aires
        run: node scripts/actualizar-barrios.mjs
        continue-on-error: true
      - name: Archivos oficiales (OEDE, conflictividad, EIL, SIPA)
        run: node scripts/descargar-fuentes.mjs
        continue-on-error: true
      - name: Procesar empleo metalúrgico (OEDE)
        run: |
          npm install --no-save xlsx@0.18.5
          node scripts/procesar-oede.mjs
        continue-on-error: true
      - name: Procesar series del INDEC (capacidad, IPI por rama, maquinaria agrícola)
        run: |
          npm install --no-save xlsx@0.18.5
          node scripts/procesar-indec.mjs
          node scripts/procesar-oede-extra.mjs
        continue-on-error: true
      - name: Calcular alertas
        run: node scripts/alertas.mjs
        continue-on-error: true
      - name: Sondeo de fuentes nuevas
        run: node scripts/sondeo-fuentes.mjs
        continue-on-error: true
      - name: Guardar cambios
        run: |
          git config user.name "observatorio-bot"
          git config user.email "observatorio-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Actualización automática de datos públicos"
          git pull --rebase -X theirs || true
          git push
