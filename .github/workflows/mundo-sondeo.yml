# Sondeo de fuentes nuevas de «Argentina frente al mundo»: solo lee y muestra lo que responde cada API.
# No guarda nada. Corre a mano o en los pedidos de cambio que tocan el sondeo.
name: Sondeo de fuentes (mundo)

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - "scripts/mundo/sondeo.mjs"
      - ".github/workflows/mundo-sondeo.yml"

permissions:
  contents: read

jobs:
  sondeo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/mundo/sondeo.mjs
